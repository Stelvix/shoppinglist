spring.application.name=ShoppingList

# Configuration de la base de données PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuration de la clé secrète JWT et du temps d'expiration
# En production, définir SECURITY_JWT_SECRET_KEY dans vos variables d'environnement (clé sécurisée de 256 bits encodée en Base64).
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLWRlZmF1bHQtc2VjcmV0LWtleS1mb3ItbXktc2hvcHBpbmctbGlzdC1hcHA=}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:86400000}

# Origines CORS autorisées (Ajoutez vos URLs de production séparées par des virgules dans les variables d'environnement)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
